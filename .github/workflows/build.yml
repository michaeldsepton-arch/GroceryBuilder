name: Build & release APK

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['scraper/**', 'data/**', 'tools/local_scraper/**', '.github/workflows/scrape.yml', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. See SETUP.md - the app must always be signed with the same key so updates install in place."
            exit 1
          fi

      - name: Fetch seed item photos (Wikimedia Commons)
        continue-on-error: true
        run: python3 tools/fetch_seed_images.py

      - name: Build recipe catalogue (adds TheMealDB, halal-filtered)
        continue-on-error: true
        run: python3 tools/build_recipes.py --mealdb

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Write signing config
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build APK
        run: |
          N=${{ github.run_number }}
          flutter build apk --release --build-name=1.0.$N --build-number=$N
          cp build/app/outputs/flutter-apk/app-release.apk budget-basket.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          MSG=$(git log -1 --pretty=%B | head -c 1500)
          gh release create "v1.0.$N" budget-basket.apk \
            --target "${{ github.sha }}" \
            --title "Budget Basket 1.0.$N" \
            --notes "$MSG"
