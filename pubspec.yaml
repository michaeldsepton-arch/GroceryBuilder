name: budget_basket
description: "Budget Basket - Red Deer grocery planner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  cached_network_image: ^4.0.5
  package_info_plus: ^10.2.2
  open_filex: ^5.0.0
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  archive: ^4.0.2
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/logo_full.png
  adaptive_icon_background: "#F7F2E6"
  adaptive_icon_foreground: assets/brand/icon_adaptive_fg.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/seed/
    - assets/seed/images/
    - assets/recipes/
    - assets/recipes/images/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
